name: Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # 🛑 STOP AND READ 🛑
        **This project is strictly clean-room.**
        Do NOT paste, link to, or reference ANY proprietary, leaked, or decompiled source code (e.g., official Photon Server code, decompiled Unity client code, PUN binaries). 
        
        #### If you include copyrighted code, you endanger this entire project. **Your issue will be immediately deleted and you will be blocked.**

  - type: checkboxes
    id: clean_room_acknowledgment
    attributes:
      label: Mandatory Acknowledgment
      description: You MUST check these boxes to submit this issue.
      options:
        - label: I confirm that this report contains NO proprietary, leaked, or decompiled code of any kind.
          required: true
        - label: I understand that posting copyrighted code will result in immediate deletion without review.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which server version are you experiencing this issue with? Type in `master` if your build is the latest build from the CI pipeline, or the output of `git rev-parse HEAD` (the commit hash) if you are building the server yourself.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: (If applicable:) Describe which game you are experiencing this issue with and what the exact issue is. Also specify the platform that you are running the server on.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Traces
      description: Upload any server and client log files you may have. Be sure to remove any private information beforehands.
    validations:
      required: false
